<!DOCTYPE html>
<!--
  ⚠️ GABARIT HTML DE L'APP WEB. Ce fichier REMPLACE celui d'Expo.

  Le CLI (`webTemplate.js` : « Attempt to read the index.html from the local project
  before falling back on the template ») lit `public/index.html` s'il existe. C'est le
  SEUL point d'entrée pour poser du HTML visible avant le JavaScript quand
  `web.output = "single"` — un fichier `app/+html.tsx` n'est PAS lu dans ce mode, il ne
  sert qu'au rendu statique. Essayé le 2026-09-10 : sans effet, index.html inchangé.

  ⚠️ Il vit dans `public/` et NON dans `dist/` : `expo export` recrée `dist` à chaque
  construction. Même piège que `_redirects`, déjà payé sur ce projet.

  ⚠️ La langue et le titre sont écrits EN DUR, pas via `%LANG_ISO_CODE%` / `%WEB_TITLE%`.
  Le chemin d'export de cette version ne substitue PAS ces marqueurs — vérifié le
  2026-09-10 : l'onglet affichait littéralement « %WEB_TITLE% ». Seuls les scripts du
  bundle sont bien ajoutés automatiquement à la fin de `<body>`. Si le titre doit changer,
  c'est ici, pas dans app.json.

  POURQUOI CE VOILE EXISTE. Le gabarit d'Expo ne pose aucun fond. Un téléphone en mode
  sombre peignait donc la page en NOIR pendant tout le téléchargement du bundle — 2,6 Mo,
  plusieurs secondes sur la liaison de Nosy Be — sans logo, sans texte, sans rien. La
  personne croyait l'app plantée, tapait, rechargeait. Signalé en test terrain le
  2026-09-10 : « j'ai l'écran noir, je clique, je clique, et ensuite ça atterrit ».

  Le lien de validation d'e-mail rendait la chose pire : on y arrive par un clic depuis sa
  boîte mail, donc TOUJOURS à froid, jamais avec le bundle en cache.

  `app/_layout.tsx` retire `#tf-boot` au premier rendu de React et enchaîne sur son propre
  <Splash />, de la même couleur : la transition ne se voit pas. Ce code existait déjà et
  ne trouvait rien à retirer.

  ⚠️ Aucune image ici, volontairement : un <img> est une requête de plus, et c'est
  précisément la requête qu'on n'a pas le temps d'attendre. Le logo est dessiné en CSS.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Sans ceci, un navigateur en mode sombre peint ses fonds en noir.
         `userInterfaceStyle: "light"` d'app.json ne vaut QUE pour le natif. -->
    <meta name="color-scheme" content="light" />
    <title>Taxi Food</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="tf-boot-style">
      html, body { background-color: #E8342A; }
      #tf-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background-color: #E8342A;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #tf-boot-logo {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.16);
        color: #ffffff;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #tf-boot-nom {
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 3px;
      }
      #tf-boot-rotative {
        width: 22px;
        height: 22px;
        margin-top: 6px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: tf-tourne 0.8s linear infinite;
      }
      @keyframes tf-tourne { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #tf-boot-rotative { animation: none; } }
    </style>
    <!-- Mesure d'audience — Umami Cloud, sans cookie, donc sans bandeau de consentement.
         INERTE tant que data-website-id est vide. data-domains : seul le vrai domaine
         compte, jamais un aperçu Netlify ni le poste de développement.
         Les étapes (panier, commande, partage) passent par lib/mesure.ts. -->
    <script>
      (function () {
        // Identifiant du site Umami de l'APP WEB — compte chrisrentanoo@gmail.com, à part de
        // celui de la vitrine (plan gratuit : un seul site par compte). Vide = rien mesuré.
        // ⚠️ Ne pas y mettre celui de la vitrine : les deux audiences se mélangeraient.
        var ID = 'bff7e721-dac8-4030-b295-5960d0842930';
        // « Ne pas me compter » : même adresse que sur la vitrine, à ouvrir aussi ICI —
        // la mémoire du navigateur est propre à chaque site. Voir landing/js/mesure.js.
        var q = new URLSearchParams(location.search);
        var demande = q.has('ne-pas-me-compter') ? 'exclure' : q.has('me-compter') ? 'inclure' : null;
        var exclu = false, stockageOk = true;
        try {
          if (demande === 'exclure') localStorage.setItem('umami.disabled', '1');
          if (demande === 'inclure') localStorage.removeItem('umami.disabled');
          exclu = !!localStorage.getItem('umami.disabled');
        } catch (e) { stockageOk = false; }
        if (demande) {
          q.delete('ne-pas-me-compter');
          q.delete('me-compter');
          var reste = q.toString();
          try { history.replaceState(null, '', location.pathname + (reste ? '?' + reste : '')); } catch (e) {}
          // Bandeau affiché dans TOUS les cas, échec compris : voir landing/js/mesure.js.
          (function (message) {
          var montrer = function () {
            var b = document.createElement('div');
            b.textContent = message + '  ✕';
            b.setAttribute('role', 'status');
            b.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483647;'
              + 'background:#1A1A1A;color:#fff;font:600 15px/1.4 system-ui,-apple-system,sans-serif;cursor:pointer;'
              + 'padding:14px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center';
            b.onclick = function () { b.remove(); };
            document.body.appendChild(b);
            // Permanent jusqu'à un appui : demande du porteur du projet, qui ne le voyait
          // pas passer en 5 s.
          };
          if (document.body) montrer(); else document.addEventListener('DOMContentLoaded', montrer);
      })(
            !stockageOk ? 'Réglage impossible : ce navigateur bloque le stockage (navigation privée ?).'
              : exclu ? 'Cet appareil n’est plus compté dans les statistiques.'
              : 'Cet appareil est de nouveau compté dans les statistiques.');
        }
        // ── L'étiquette du groupe Facebook (?g=), posée par la vitrine ──────────
        // La vitrine publie `/jour?g=boncoin` dans les groupes Facebook et reporte
        // l'étiquette sur le lien « Commander » (landing/js/mesure.js). Elle arrive
        // donc ICI dans l'adresse. Sans ce bloc, on saurait quel groupe fait OUVRIR
        // une page, jamais lequel fait passer une COMMANDE : les deux sites sont deux
        // comptes Umami distincts, rien ne traverse tout seul.
        //
        // ⚠️ Mémorisée pour l'onglet : entre l'arrivée et « Commander » il y a le
        // catalogue, la fiche, le panier, l'adresse. L'adresse de la page, elle, aura
        // changé dix fois. `sessionStorage` meurt avec l'onglet — aucune trace durable.
        //
        // ⚠️ DEUX MÉMOIRES, ET ELLES NE SERVENT PAS À LA MÊME CHOSE :
        //   `tf_groupe` (sessionStorage) meurt avec l'onglet et sert à la mesure
        //       d'audience — une visite, une session.
        //   `tf_provenance` (localStorage, 7 jours) survit à la fermeture et sert à
        //       rattacher une COMMANDE à son groupe. Quelqu'un qui clique le lundi et
        //       commande le jeudi vient bien de ce groupe ; trois semaines plus tard,
        //       non. La date est rangée avec l'étiquette et `lib/provenance.ts` la
        //       relit — voir ce fichier pour le raisonnement complet.
        var groupe = '';
        try {
          var brutG = (q.get('g') || '').toLowerCase();
          if (/^[a-z0-9][a-z0-9-]{0,23}$/.test(brutG)) {
            sessionStorage.setItem('tf_groupe', brutG);
            localStorage.setItem('tf_provenance', JSON.stringify({ g: brutG, t: Date.now() }));
          }
          groupe = sessionStorage.getItem('tf_groupe') || '';
        } catch (e) { /* stockage bloqué : on s'en passe, jamais bloquant */ }

        if (exclu) return;
        if (!ID || location.hostname !== 'taxifood.distripro207.com') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://cloud.umami.is/script.js';
        s.setAttribute('data-website-id', ID);
        s.setAttribute('data-domains', 'taxifood.distripro207.com');
        // ⚠️ L'étiquette est ajoutée à TOUS les événements, en enveloppant `umami.track`
        // une fois — et NON en modifiant `lib/mesure.ts`. Deux raisons :
        //   1. ce fichier est le gabarit WEB, il ne part dans aucun binaire : la mesure
        //      par groupe n'existe que sur le site, et aucune mise à jour à distance
        //      (OTA) n'est nécessaire pour la livrer ;
        //   2. un seul point de passage, donc aucun appel de `mesurer()` à ne pas
        //      oublier — `commande-validee` comprise, qui est tout l'intérêt.
        // La vue de page, elle, porte déjà `?g=` dans son adresse.
        s.onload = function () {
          if (!groupe) return;
          try {
            var u = window.umami;
            if (!u || typeof u.track !== 'function') return;
            var envoi = u.track.bind(u);
            u.track = function (nom, donnees) {
              // `umami.track` accepte aussi un objet ou une fonction (vue de page
              // manuelle) : on n'enveloppe que la forme « nom + propriétés ».
              if (typeof nom !== 'string') return envoi.apply(null, arguments);
              var d = {};
              for (var k in (donnees || {})) d[k] = donnees[k];
              d.groupe = groupe;
              return envoi(nom, d);
            };
          } catch (e) { /* une mesure ne casse jamais l'app */ }
        };
        document.head.appendChild(s);
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- Voile de démarrage : visible avant le premier octet de JavaScript.
         Retiré par app/_layout.tsx au premier rendu de React. -->
    <div id="tf-boot">
      <div id="tf-boot-logo">TF</div>
      <div id="tf-boot-nom">TAXI FOOD</div>
      <div id="tf-boot-rotative"></div>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
