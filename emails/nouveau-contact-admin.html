<!-- Taxi Food — e-mail de notification interne (Christopher).
     SOURCE DE VERITE. Ce HTML est DUPLIQUE dans le noeud « Prep » du workflow
     n8n « Taxi Food — Nouveau contact ». Toute modification ici doit y etre
     repoussee, sinon les deux divergent en silence.

     Jetons remplaces par le noeud Prep :
       {{TYPE}}      Client · Restaurateur · Livreur
       {{TITRE}}     ligne de titre, deja formulee
       {{NOM}}       nom de la personne
       {{LIGNES}}    <tr> deja construits : une ligne par champ renseigne
       {{QUAND}}     date et heure, format francais
       {{TEL_BRUT}}  numero sans espaces, pour le lien WhatsApp
       {{TEL}}       numero tel qu il a ete saisi
-->
<div style="margin:0;padding:0;background:#F5F2EF;font-family:Archivo,Helvetica,Arial,sans-serif">
<div style="max-width:600px;margin:0 auto;background:#ffffff">

  <!-- Bandeau -->
  <div style="background:#1A1A1A;padding:18px 24px">
    <img src="https://taxifood.rentanoo.com/assets/icon-512.png" alt="Taxi Food" width="34" height="34" style="width:34px;height:34px;border-radius:9px;vertical-align:middle;display:inline-block">
    <span style="font:800 16px/1 Archivo,Helvetica,Arial,sans-serif;color:#ffffff;letter-spacing:-.02em;vertical-align:middle;margin-left:10px">TAXI FOOD</span>
    <span style="font:400 11px/1 'Courier New',monospace;color:#8A8580;letter-spacing:.16em;vertical-align:middle;margin-left:8px">NOSY BE</span>
  </div>

  <!-- Titre -->
  <div style="padding:26px 24px 6px">
    <div style="display:inline-block;padding:5px 11px;border-radius:999px;background:#FDECEB;color:#C42419;font:700 11px/1 Archivo,Helvetica,Arial,sans-serif;letter-spacing:.06em">{{TYPE}}</div>
    <h1 style="font:800 23px/1.2 Archivo,Helvetica,Arial,sans-serif;color:#1A1A1A;margin:14px 0 0;letter-spacing:-.02em">{{TITRE}}</h1>
    <p style="font:400 14px/1.5 Archivo,Helvetica,Arial,sans-serif;color:#6B6662;margin:8px 0 0">{{QUAND}}</p>
  </div>

  <!-- Le detail -->
  <div style="padding:18px 24px 4px">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;background:#FBFAF9;border:1px solid #E9E5E0;border-radius:14px">
      {{LIGNES}}
    </table>
  </div>

  <!-- Rappeler tout de suite -->
  <div style="padding:20px 24px 8px">
    <a href="https://wa.me/{{TEL_BRUT}}" style="display:inline-block;padding:13px 22px;border-radius:999px;background:#C42419;color:#ffffff;font:800 14px/1 Archivo,Helvetica,Arial,sans-serif;text-decoration:none">Répondre sur WhatsApp</a>
    <a href="tel:{{TEL}}" style="display:inline-block;padding:13px 22px;margin-left:8px;border-radius:999px;background:#ffffff;color:#1A1A1A;border:1.5px solid #DCD8D3;font:700 14px/1 Archivo,Helvetica,Arial,sans-serif;text-decoration:none">Appeler</a>
  </div>

  <!-- Pied -->
  <div style="padding:22px 24px 26px;border-top:1px solid #EFEBE6;margin-top:18px">
    <p style="font:400 12px/1.5 Archivo,Helvetica,Arial,sans-serif;color:#6B6662;margin:0">Taxi Food Nosy Be — livraison de repas à Nosy Be, Madagascar 🇲🇬</p>
    <p style="font:400 12px/1.5 Archivo,Helvetica,Arial,sans-serif;color:#9A948E;margin:5px 0 0">Envoyé automatiquement depuis <a href="https://taxifood.rentanoo.com" style="color:#9A948E">taxifood.rentanoo.com</a></p>
  </div>

</div>
</div>
