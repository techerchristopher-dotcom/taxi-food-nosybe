# Déploiement Netlify de l'app cliente en PWA (export web Expo, SPA).
# Créer un site Netlify pointant sur ce dossier (base directory = "app").
# Variables d'env à définir dans Netlify (Site settings → Environment variables) :
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
[build]
  command = "npx expo export -p web"
  publish = "dist"

# SPA : toutes les routes servies par le même index.html (routing côté client).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
