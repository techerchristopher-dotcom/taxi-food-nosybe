# Taxi Food Nosy Be — configuration Netlify
#
# Ce fichier suppose que la "base directory" du site Netlify est reglee sur
# "landing". Le dossier publie est alors ce dossier-ci.
#   Netlify > Site configuration > Build & deploy > Base directory : landing
#
# Si vous preferez laisser la base a la racine du depot, deplacez ce fichier
# a la racine et remplacez publish = "." par publish = "landing".
#
# Dans les deux cas, les fichiers _headers et _redirects places a cote de
# index.html sont lus par Netlify quoi qu'il arrive : ils font foi.

[build]
  publish = "."
  command = ""

# --- Fonctions --------------------------------------------------------------
# Pages de partage /p/<id> et /r/<id> (apercu WhatsApp + renvoi vers le store).
# Le chemin est declare dans la fonction elle-meme (`export const config`), pas
# ici : c'est la convention des Netlify Functions v2.
#
# ⚠️ La fonction a besoin de DEUX variables d'environnement, a poser dans
# Netlify > Site configuration > Environment variables :
#     SUPABASE_URL       = https://bmdveawomizjpiebgtkj.supabase.co
#     SUPABASE_ANON_KEY  = la cle anon/publishable (celle de app/.env)
# Sans elles la fonction renvoie sur l'accueil du site au lieu d'une fiche.
# La cle anon est publique par conception (la RLS protege) ; la cle service_role
# n'a rien a faire ici.

[functions]
  directory = "netlify/functions"

# --- En-tetes ---------------------------------------------------------------
# Cache long sur les images, la video et les polices : leur nom encode la
# largeur, donc un remplacement passe par un nouveau nom de fichier.
# HTML toujours revalide, pour qu'une correction de texte soit visible tout de suite.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Redirections -----------------------------------------------------------
# ORDRE OBLIGATOIRE : creer l'enregistrement DNS taxifood.rentanoo.com et le
# definir comme "primary domain" AVANT le premier deploiement public.
# Toutes les URL absolues du site (canonical, og:image, sitemap, JSON-LD)
# pointent sur ce nom. Publier avant qu'il n'existe, c'est declarer un
# canonical vers un hote injoignable — Google desindexe, et les scrapers
# WhatsApp/Facebook ne peuvent pas recuperer l'image d'apercu.
#
# ⚠️ Le "primary domain" NE SUFFIT PAS, verifie le 2026-08-24 : une fois le
# domaine pose, le certificat emis et HTTPS force, le sous-domaine
# <site>.netlify.app repondait toujours 200 avec le site entier. Netlify ne
# redirige pas son propre sous-domaine, et ne pose PAS de X-Robots-Tag:
# noindex dessus en production (il ne le fait que sur les deploy previews et
# les branch deploys). La protection reelle est la regle de redirection
# absolue posee dans _redirects.
# Filet de secours si un deploiement netlify.app est inevitable avant le
# branchement : voir la ligne commentee en bas de _redirects.

# Normalisation d'URL : une regle par racine de langue. Sans les deux dernieres,
# /en/index.html et /it/index.html restent servis comme doublons de /en/ et /it/.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/index.html"
  to = "/en/"
  status = 301
  force = true

[[redirects]]
  from = "/it/index.html"
  to = "/it/"
  status = 301
  force = true

# Anciennes ancres de la maquette a onglet unique -> nouvelle URL dediee.
# Un raccourci mene a la page de SA langue.
[[redirects]]
  from = "/restaurateurs"
  to = "/restaurants-partenaires/"
  status = 301

[[redirects]]
  from = "/partenaire"
  to = "/restaurants-partenaires/"
  status = 301

[[redirects]]
  from = "/en/partner"
  to = "/en/restaurant-partners/"
  status = 301

[[redirects]]
  from = "/it/partner"
  to = "/it/ristoranti-partner/"
  status = 301
