     de recherche, ou elle concurrencerait l'accueil. -->
<meta name="robots" content="noindex,follow">

<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{height:100%}
 body{margin:0;background:#F5F2EF;color:#1A1A1A;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}

 /* Le selecteur de langue reste au-dessus de tout : c'est le premier geste
    possible, et il doit rester atteignable a n'importe quelle etape. */
 .langues{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
          z-index:20;display:flex;gap:3px;padding:4px;border-radius:999px;
          background:#EAE5E0;border:1px solid #DCD8D3}
 .langues button{border:0;background:none;font:700 12px/1 ui-monospace,monospace;letter-spacing:.08em;
                 color:#6B6662;padding:7px 11px;border-radius:999px;cursor:pointer;font-family:inherit}
 .langues button.on{background:#1A1A1A;color:#fff}

 .scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;overflow-y:auto;
        padding:calc(62px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));
        opacity:0;visibility:hidden;transform:translateX(28px);
        transition:opacity .32s ease,transform .32s ease,visibility .32s}
 .scene.on{opacity:1;visibility:visible;transform:none}
 .scene.gone{transform:translateX(-28px)}

 .kick{font:700 11px/1 ui-monospace,monospace;letter-spacing:.2em;color:#A75B09;text-align:center}
 h1{font-size:clamp(23px,6.2vw,31px);line-height:1.16;letter-spacing:-.025em;margin:12px 0 0;
    text-align:center;text-wrap:balance}
 .sub{font-size:16px;line-height:1.55;color:#4A4744;margin:12px 0 0;text-align:center;
      max-width:22em;text-wrap:pretty}

 .phone{position:relative;margin-top:18px;background:#17171A;border-radius:28px;padding:7px;
        box-shadow:0 18px 44px rgba(0,0,0,.28);flex:0 1 auto;min-height:0}
 .phone img{display:block;border-radius:22px;height:min(40svh,320px);width:auto;max-width:74vw}

 /* ⚠️ Le repere se positionne contre .ecran, qui epouse EXACTEMENT l'image —
    pas contre .phone, dont les 7px de padding fixes decalaient tout, et d'un
    montant qui variait avec la taille d'ecran puisque l'image, elle, se
    redimensionne. Les pourcentages ci-dessous se lisent donc directement sur
    la capture, ce qui les rend verifiables. */
 .ecran{position:relative;display:block;line-height:0}

 /* Le halo guide l'oeil. Il bat lentement — attirer sans stresser — et il
    ENTOURE la cible sans la couvrir : contour fin, jamais de fond. */
 .halo{position:absolute;border:2.5px solid #DF3228;border-radius:999px;pointer-events:none;
       background:none;animation:bat 1.7s ease-in-out infinite}
 @keyframes bat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.72}}
 .doigt{position:absolute;font-size:27px;pointer-events:none;animation:tape 1.6s ease-in-out infinite;
        filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
 @keyframes tape{0%,100%{transform:translateY(4px)}50%{transform:translateY(-4px)}}

 .barre{display:flex;gap:7px;margin-top:20px}
 .pt{width:8px;height:8px;border-radius:999px;background:#DCD8D3;transition:.3s}
 .pt.on{background:#DF3228;width:22px}

 .btn{display:block;width:100%;max-width:330px;text-align:center;background:#DF3228;color:#fff;
      text-decoration:none;font-weight:700;font-size:17px;padding:17px;border:0;border-radius:999px;
      margin-top:20px;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(223,50,40,.3)}
 .btn small{display:block;font-size:12.5px;font-weight:400;opacity:.85;margin-top:3px}
 .btn.ghost{background:#fff;color:#1A1A1A;border:1.5px solid #DCD8D3;box-shadow:none;
            margin-top:11px;font-size:16px;padding:14px}
 .btn.ghost small{color:#8A827A;opacity:1}

 /* L'ecran de choix de compte Google est un ecran SYSTEME, incapturable. On le
    redessine — ce qui permet en prime de mettre en evidence la bonne adresse. */
 .choix{width:min(84vw,320px);background:#fff;border-radius:20px;border:1px solid #E9E5E0;
        padding:8px;margin-top:18px;box-shadow:0 10px 26px rgba(26,26,26,.09)}
 .cpt{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:14px}
 .cpt.bon{background:#FFF1EF;outline:2px solid #DF3228;animation:bat 1.7s ease-in-out infinite}
 .pastille{width:34px;height:34px;border-radius:999px;background:#DF3228;color:#fff;flex:none;
           display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
 .pastille.gris{background:#C9C4BE}
 .cpt b{display:block;font-size:14.5px}
 .cpt span{display:block;font-size:12.5px;color:#8A827A;margin-top:1px}
 .champ{margin-top:7px;padding:13px 14px;border:1.5px solid #DCD8D3;border-radius:12px;font-size:15px}
 .champ.mdp{border-color:#DF3228;font-size:17px;letter-spacing:.18em}
 .lbl{font:600 11px ui-monospace,monospace;letter-spacing:.14em;color:#8A827A;margin-top:16px}
 .lbl:first-child{margin-top:0}

 .avert{display:flex;gap:10px;align-items:flex-start;background:#FFF7E8;border:1px solid #F3E3C2;
        border-radius:15px;padding:13px 15px;margin-top:16px;max-width:340px;
        font-size:14px;line-height:1.5;color:#6B4B12;text-align:left}
 @media (prefers-reduced-motion:reduce){.halo,.doigt,.cpt.bon{animation:none}.scene{transition:none}}
</style>
</head>

<script>
(function () {
  /* Les trois langues vivent dans UNE page, pas dans trois fichiers. Le guide
     va changer souvent au debut : trois copies auraient diverge des la premiere
     correction, et personne ne s'en serait apercu avant qu'un restaurateur
     italien suive une etape qui n'existe plus. */
  var T = {
    fr: {
      k0:'BIENVENUE SUR TAXI FOOD', h0:'Félicitations,<br>votre restaurant<br>rejoint Taxi&nbsp;Food.',
      s0:'Il ne reste qu’à ouvrir votre espace. Quelques gestes, moins d’une minute.', b0:'Commencer',
      k1:'VOTRE ESPACE', h1:'Vos commandes,<br>en direct.', s1:'Vous acceptez d’un appui. Rien à installer.',
      k2:'UNE SEULE QUESTION', h2:'Votre adresse mail,<br>c’est laquelle ?',
      s2:'Le plus rapide dépend de votre boîte mail.',
      voieG:'Une adresse Gmail', voieGs:'…@gmail.com — 2 appuis, sans mot de passe',
      voieA:'Une autre adresse', voieAs:'Yahoo, Outlook, Orange, adresse pro…',
      g1s2:'GESTE 1 SUR 2', g2s2:'GESTE 2 SUR 2', g1s3:'GESTE 1 SUR 3', g2s3:'GESTE 2 SUR 3',
      h3:'Appuyez sur Google.', s3:'Pas de mot de passe à créer.',
      h4:'Choisissez l’adresse mail<br>de votre restaurant.', s4:'C’est elle qui ouvrira votre espace, à chaque fois.',
      bonne:'l’adresse de votre restaurant', mauvaise:'votre adresse personnelle',
      avert1:'Si plusieurs adresses s’affichent, prenez <b>celle du restaurant</b> — c’est la seule qui donne accès à vos commandes.',
      h6:'La première fois,<br>créez votre accès.', s6:'Une seule fois. Ensuite, ce sera « E-mail ».',
      h7:'Votre adresse,<br>puis un mot de passe.', s7:'Votre adresse est déjà reconnue. Choisissez un mot de passe simple.',
      lblMail:'ADRESSE MAIL', lblMdp:'MOT DE PASSE',
      avert2:'<b>Notez ce mot de passe.</b> Les fois suivantes, vous appuierez simplement sur « E-mail » et le saisirez.',
      fait:'C’EST FAIT', h5:'Vous y êtes.', s5:'Vos commandes arrivent ici. Un appui pour accepter.',
      cta:'Je me connecte', revoir:'Revoir depuis le début', suivant:'Suivant',
    },
    en: {
      k0:'WELCOME TO TAXI FOOD', h0:'Congratulations,<br>your restaurant<br>is joining Taxi&nbsp;Food.',
      s0:'All that’s left is opening your space. A few taps, under a minute.', b0:'Get started',
      k1:'YOUR SPACE', h1:'Your orders,<br>live.', s1:'Accept with one tap. Nothing to install.',
      k2:'ONE QUESTION', h2:'Which email address<br>will you use?',
      s2:'The quickest route depends on your mailbox.',
      voieG:'A Gmail address', voieGs:'…@gmail.com — 2 taps, no password',
      voieA:'Another address', voieAs:'Yahoo, Outlook, work address…',
      g1s2:'STEP 1 OF 2', g2s2:'STEP 2 OF 2', g1s3:'STEP 1 OF 3', g2s3:'STEP 2 OF 3',
      h3:'Tap Google.', s3:'No password to create.',
      h4:'Choose your<br>restaurant’s address.', s4:'It’s the one that opens your space, every time.',
      bonne:'your restaurant’s address', mauvaise:'your personal address',
      avert1:'If several addresses appear, pick <b>the restaurant’s one</b> — it’s the only one that opens your orders.',
      h6:'First time only:<br>set up your access.', s6:'Once. After that, it’s just “E-mail”.',
      h7:'Your address,<br>then a password.', s7:'Your address is already recognised. Just pick a simple password.',
      lblMail:'EMAIL ADDRESS', lblMdp:'PASSWORD',
      avert2:'<b>Write that password down.</b> Next time you’ll simply tap “E-mail” and enter it.',
      fait:'ALL SET', h5:'You’re in.', s5:'Your orders land here. One tap to accept.',
      cta:'Log me in', revoir:'Watch again', suivant:'Next',
    },
    it: {
      k0:'BENVENUTO SU TAXI FOOD', h0:'Congratulazioni,<br>il tuo ristorante<br>entra in Taxi&nbsp;Food.',
      s0:'Resta solo da aprire il tuo spazio. Pochi tocchi, meno di un minuto.', b0:'Iniziamo',
      k1:'IL TUO SPAZIO', h1:'I tuoi ordini,<br>in diretta.', s1:'Accetti con un tocco. Niente da installare.',
      k2:'UNA SOLA DOMANDA', h2:'Quale indirizzo email<br>userai?',
      s2:'La via più rapida dipende dalla tua casella.',
      voieG:'Un indirizzo Gmail', voieGs:'…@gmail.com — 2 tocchi, senza password',
      voieA:'Un altro indirizzo', voieAs:'Yahoo, Outlook, indirizzo di lavoro…',
      g1s2:'PASSO 1 DI 2', g2s2:'PASSO 2 DI 2', g1s3:'PASSO 1 DI 3', g2s3:'PASSO 2 DI 3',
      h3:'Tocca Google.', s3:'Nessuna password da creare.',
      h4:'Scegli l’indirizzo<br>del tuo ristorante.', s4:'È quello che aprirà il tuo spazio, ogni volta.',
      bonne:'l’indirizzo del ristorante', mauvaise:'il tuo indirizzo personale',
      avert1:'Se compaiono più indirizzi, scegli <b>quello del ristorante</b> — è l’unico che apre i tuoi ordini.',
      h6:'Solo la prima volta:<br>crea il tuo accesso.', s6:'Una volta sola. Poi basterà «E-mail».',
      h7:'Il tuo indirizzo,<br>poi una password.', s7:'Il tuo indirizzo è già riconosciuto. Scegli una password semplice.',
      lblMail:'INDIRIZZO EMAIL', lblMdp:'PASSWORD',
      avert2:'<b>Annota la password.</b> Le volte successive toccherai «E-mail» e la inserirai.',
      fait:'FATTO', h5:'Ci sei.', s5:'I tuoi ordini arrivano qui. Un tocco per accettare.',
      cta:'Accedi', revoir:'Rivedi da capo', suivant:'Avanti',
    },
  };

  function peindre(l) {
    var d = T[l] || T.fr;
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(function (e) {
      var v = d[e.getAttribute('data-t')];
      if (v != null) e.innerHTML = v;
    });
    document.querySelectorAll('.langues button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-lang') === l);
    });
    try { localStorage.setItem('tf-guide-lang', l); } catch (e) { /* navigation privee */ }
  }

  /* Langue de depart : celle deja choisie, sinon celle du telephone. Un
     restaurateur italien ne devrait pas avoir a chercher un bouton. */
  var depart = 'fr';
  try { depart = localStorage.getItem('tf-guide-lang') || ''; } catch (e) {}
  if (!T[depart]) {
    var n = (navigator.language || 'fr').slice(0, 2).toLowerCase();
    depart = T[n] ? n : 'fr';
  }
  peindre(depart);

  var scenes = [].slice.call(document.querySelectorAll('.scene'));
  /* ⚠️ On cible par data-i, PAS par position dans le document : le parcours
     bifurque, l'ordre du HTML ne correspond plus a l'ordre des ecrans. */
  function aller(i) {
    scenes.forEach(function (s) {
      var n = parseInt(s.getAttribute('data-i'), 10);
      s.classList.toggle('on', n === i);
      s.classList.toggle('gone', n < i);
    });
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (e) {
    var l = e.target.closest('[data-lang]');
    if (l) { peindre(l.getAttribute('data-lang')); return; }
    var b = e.target.closest('[data-go]');
    if (b) aller(parseInt(b.getAttribute('data-go'), 10));
  });
})();
</script>
