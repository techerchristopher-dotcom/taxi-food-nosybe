<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostic position</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:24px;background:#FFF8F0;color:#1A1A1A}
h1{font-size:20px}button{font-size:17px;padding:16px 20px;border:0;border-radius:999px;background:#E8590C;color:#fff;font-weight:600;width:100%}
pre{background:#fff;border:1px solid #eadfd2;border-radius:12px;padding:14px;white-space:pre-wrap;word-break:break-word;font-size:13px}</style>
</head><body>
<h1>Diagnostic de position</h1>
<p>Page temporaire. Touche le bouton et envoie-moi ce qui s'affiche.</p>
<button id="b">Demander ma position</button>
<pre id="o">...</pre>
<script>
var o = document.getElementById('o');
function log(s){ o.textContent += "\n" + s; }
o.textContent = "contexte securise (https) : " + window.isSecureContext
  + "\ngeolocation disponible : " + !!(navigator.geolocation)
  + "\nnavigateur : " + navigator.userAgent;
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({name:'geolocation'})
    .then(function(p){ log("permission declaree : " + p.state); })
    .catch(function(e){ log("permissions.query indisponible : " + e); });
} else { log("API permissions absente (normal sur iOS Safari)"); }
document.getElementById('b').onclick = function(){
  log("--- appel en cours ---");
  var t0 = Date.now();
  navigator.geolocation.getCurrentPosition(
    function(p){ log("OK en " + (Date.now()-t0) + " ms - lat " + p.coords.latitude.toFixed(5) + " lng " + p.coords.longitude.toFixed(5) + " (precision " + Math.round(p.coords.accuracy) + " m)"); },
    function(e){ log("ECHEC en " + (Date.now()-t0) + " ms - code " + e.code + " (" + (e.code===1?"REFUS":e.code===2?"INDISPONIBLE":"DELAI DEPASSE") + ") : " + e.message); },
    { enableHighAccuracy:false, timeout:20000, maximumAge:60000 });
};
</script></body></html>
