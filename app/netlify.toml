# Taxi Food — version WEB de l'application mobile.
#
# Ce n'est PAS un site separe : c'est le meme code que l'app iOS et Android,
# compile pour le navigateur (`expo export --platform web`). Une correction dans
# l'app corrige donc aussi le site, et les deux ne peuvent pas diverger.
#
# Objectif : permettre aux clients de commander en attendant la validation des
# stores (iOS validee, Android en revue).
#
# ⚠️ Netlify > Site configuration > Environment variables doit porter les MEMES
# variables que app/.env, sinon le bundle est compile sans backend :
#     EXPO_PUBLIC_SUPABASE_URL
#     EXPO_PUBLIC_SUPABASE_ANON_KEY
#     EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
# La cle anon est publique par conception (la RLS protege) ; la cle service_role
# n'a rien a faire ici.
#
# ⚠️ PAS DE VARIABLE STRIPE ICI. La cle publiable vient du Vault Supabase, servie
# par l'Edge Function `creer-paiement` : le site web et les applications mobiles
# lisent donc la meme, et changer de compte Stripe ne demande aucun redeploiement.
# `EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY` existe en secours (voir app/.env.example)
# et doit rester vide tant que le Vault repond. La cle SECRETE sk_... n'a jamais
# rien a faire dans un bundle navigateur.
#
# ⚠️ L'origine de ce site doit etre ajoutee dans Supabase > Authentication >
# URL Configuration > Redirect URLs. `signInWithOAuth` passe
# `redirectTo: window.location.origin` : une origine absente de la liste fait
# revenir Google sur l'accueil SANS session, sans message d'erreur.

[build]
  base    = "app"
  command = "npm ci && npx expo export --platform web --output-dir dist"
  publish = "app/dist"

[build.environment]
  NODE_VERSION = "20"

# --- Repli SPA -------------------------------------------------------------
# expo-router utilise de VRAIES URL (/restaurant/<id>, /product/<id>, /p/<id>).
# L'export ne produit qu'un index.html : sans cette regle, ouvrir un lien
# partage directement repond 404. Elle doit rester la DERNIERE.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- En-tetes --------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Universal Links (iOS) / App Links (Android) pour CE domaine — celui que le
# bouton de `repondre-commande.mjs` vise apres acceptation/refus. Sans un
# Content-Type explicite, Netlify sert ces fichiers sans extension en
# `application/octet-stream`, et le verifieur Digital Asset Links d'Android
# refuse alors `assetlinks.json`. iOS est plus tolerant, mais autant poser les
# deux la meme regle que sur le site vitrine (`landing/netlify.toml`).
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Les bundles portent leur empreinte dans le nom : cache long sans risque.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# L'index doit etre revalide, sinon un deploiement reste invisible.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
